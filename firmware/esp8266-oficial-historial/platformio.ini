; Hydor-Cualli — Firmware embajador CON HISTORIAL (Firebase)
; Placa: NodeMCU ESP8266. Un sensor a la vez por A0, jumper en D7.
; Igual que la versión base, pero además llena /historial.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    mobizt/Firebase ESP8266 Client@4.3.19
